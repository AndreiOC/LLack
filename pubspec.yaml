name: foss_chat
description: "FOSS Chat - Local-first, multi-provider chat application"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core Framework
  cupertino_icons: ^1.0.8
  
  # Database - sqflite for mobile, sqflite_common_ffi for desktop
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  
  # Secure Storage
  flutter_secure_storage: ^9.2.2
  
  # HTTP & Networking
  dio: ^5.7.0
  connectivity_plus: ^6.0.0
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Background Tasks
  workmanager: ^0.5.2
  
  # Utilities
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  intl: ^0.20.2
  
  # UI Components
  smooth_page_indicator: ^1.2.0+3
  flutter_svg: ^2.0.17
  dropdown_button2: ^2.3.9
  flutter_slidable: ^3.1.2
  pull_to_refresh: ^2.0.0
  
  # Chat Rendering
  flutter_markdown: ^0.7.6
  flutter_highlight: ^0.7.0
  markdown: ^7.3.0
  
  # Network Discovery
  bonsoir: ^5.1.11
  network_info_plus: ^6.1.3
  
  # Export & Analytics
  share_plus: ^10.1.4
  fl_chart: ^0.70.2
  
  # Notifications
  flutter_local_notifications: ^19.0.0
  
  # Desktop
  hotkey_manager: ^0.2.1
  
  # Freezed for immutable classes
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  # Code Generation - locked versions for compatibility
  build_runner: ^2.4.11
  build_resolvers: ^2.4.2
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/migrations/
